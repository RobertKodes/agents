[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
remappings = [
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "forge-std/=lib/forge-std/src/",
]

[lint]
lint_on_build = false
